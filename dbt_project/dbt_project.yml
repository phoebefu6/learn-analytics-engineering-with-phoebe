# dbt_project.yml - the whole project's contract with dbt.
# Session b2 walks this file line by line; nothing here is decoration.

name: bazaar
version: "1.0.0"
profile: bazaar          # resolved from profiles.yml in this directory

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  bazaar:
    # Layering is a materialization decision, not just a folder convention:
    # staging is cheap and disposable, marts are what people query.
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral      # exists only inside the models that ref() it
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  # One place for the analysis windows the business questions use, so no model
  # hard-codes a date and no two models disagree about "the last fortnight".
  recent_window_start: "2026-06-16"
  prior_window_start: "2026-06-02"
  incident_day: "2026-06-10"
  small_sample_floor: 30
